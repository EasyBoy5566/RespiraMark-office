<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RespiraMark 中央監視</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <div class="brand">RespiraMark 中央監視</div>
    <div class="header-right">
      <button id="themeToggle" class="theme-btn" type="button">☀ 淺色</button>
      <span id="conn" class="conn offline">● 連線中…</span>
      <span id="clock">--:--:--</span>
    </div>
  </header>

  <main id="grid"></main>

  <div id="empty" class="empty">
    等待裝置連線…<br>
    <span class="hint">Pi 端啟動監測（或執行 fake_pi.py）後會自動出現在這裡</span>
  </div>

  <div id="overlay" class="overlay hidden"></div>

  <script src="/static/app.js"></script>
</body>
</html>
