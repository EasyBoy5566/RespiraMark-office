<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RespiraMark 中央監視</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <div class="brand">RespiraMark 中央監視</div>
    <div class="header-right">
      <span id="conn" class="conn offline">● 連線中…</span>
      <span id="clock">--:--:--</span>
      <div class="user-menu-wrap">
        <button id="who" class="who-btn" type="button">選單 ▾</button>
        <div id="userMenu" class="user-menu hidden">
          <a id="adminLink" class="user-menu-item hidden" href="/admin">⚙ 設備管理</a>
          <button id="soundToggle" class="user-menu-item" type="button" title="裝置離線時播放提示音（預設關）">🔕 離線提示音</button>
          <button id="themeToggle" class="user-menu-item" type="button">☀ 淺色</button>
          <button id="logoutBtn" class="user-menu-item hidden" type="button">登出</button>
        </div>
      </div>
    </div>
  </header>

  <main id="grid"></main>

  <div id="empty" class="empty">
    等待裝置連線…<br>
    <span class="hint">Pi 端啟動監測（或執行 fake_pi.py）後會自動出現在這裡</span>
  </div>

  <div id="overlay" class="overlay hidden"></div>

  <footer class="disclaimer">本畫面僅供觀察參考，不可作為臨床警報依據 · <span id="verInfo"></span></footer>

  <script src="/static/auth.js"></script>
  <script src="/static/alarm_levels.js"></script>
  <script src="/static/footer.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
