<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RespiraMark 設備管理</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <div class="brand">RespiraMark 設備維護管理</div>
    <div class="header-right">
      <a class="theme-btn" href="/">← 監視儀表板</a>
      <span id="who" class="who"></span>
      <button id="logoutBtn" class="theme-btn hidden" type="button">登出</button>
      <button id="themeToggle" class="theme-btn" type="button">☀ 淺色</button>
      <span id="conn" class="conn offline">● 連線中…</span>
      <span id="clock">--:--:--</span>
    </div>
  </header>

  <main class="admin-main">
    <section>
      <h2>設備健康狀態</h2>
      <div id="devEmpty" class="admin-empty">等待裝置連線…</div>
      <div id="devGrid" class="admin-grid"></div>
      <p class="admin-hint">
        數值取不到時顯示 —（例如該欄位在非 Pi 環境無法取得）。
        「移除」只對離線裝置有效，用途是清出版面——裝置重新連上會自動回來。
      </p>
    </section>

    <section>
      <h2>帳號清單（唯讀）</h2>
      <div class="acc-card">
        <table class="acc-table" id="accTable">
          <thead><tr><th>帳號</th><th>角色</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <p class="admin-hint">建立、刪除帳號或改密碼：在伺服器執行 python tools/make_user.py（本頁只供檢視）。</p>
    </section>
  </main>

  <script src="/static/sys.js"></script>
  <script src="/static/auth.js"></script>
  <script src="/static/admin.js"></script>
</body>
</html>
